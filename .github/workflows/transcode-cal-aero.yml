name: Convert Cal Aero MOV videos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/cinematic-portfolio
          lfs: true
      - name: Convert QuickTime to browser-compatible MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -y -i public/CalAero/2026_Competitive_Plane.mov -an -c:v libx264 -preset medium -crf 28 -pix_fmt yuv420p -movflags +faststart public/CalAero/2026_Competitive_Plane.mp4
          ffmpeg -y -i public/CalAero/2026_Flight_Video.mov -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart public/CalAero/2026_Flight_Video.mp4
      - name: Commit MP4s to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/CalAero/2026_Competitive_Plane.mp4 public/CalAero/2026_Flight_Video.mp4
          git diff --cached --quiet || (git commit -m "Transcode Cal Aero MOV clips to web-ready MP4" && git push origin HEAD:design/cinematic-portfolio)
